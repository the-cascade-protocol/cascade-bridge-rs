[package]
name = "cascade-bridge-cli"
description = "The cascade-bridge command: converts a document with an adapter, and runs an adapter's test manifest."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "cascade-bridge"
path = "src/main.rs"

[dependencies]
cascade-bridge = { path = "../bridge", version = "=0.1.0" }
oxiri = "=0.2.11"
serde_json = "=1.0.151"

[dev-dependencies]
oxigraph = { version = "=0.5.11", default-features = false, features = ["rdf-12"] }
tempfile = "=3.27.0"

[[test]]
name = "node_host"
test = false
