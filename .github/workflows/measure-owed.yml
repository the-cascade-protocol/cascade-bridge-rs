# MEASUREMENT for cascade-bridge-rs#161, removed before the pull request is ready: the count of
# entries the accounting check fails on both adapters at their mains, the check on inputs it was
# not tuned on, and its cost against main on both hosts.
name: measure-owed

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: measure-owed-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  measure:
    name: measure
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          path: cascade-bridge-rs
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: main
          path: main/cascade-bridge-rs
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: the-cascade-protocol/cascade-bridge-adapter-fhir-r4
          path: cascade-bridge-adapter-fhir-r4
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: the-cascade-protocol/cascade-bridge-adapter-ccda
          path: cascade-bridge-adapter-ccda
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: the-cascade-protocol/cascade-vocabulary
          path: cascade-vocabulary
          persist-credentials: false
      - run: |
          rustup toolchain install --profile minimal
          channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          rustup default "$channel"
          rustup target add wasm32-unknown-unknown
        working-directory: cascade-bridge-rs
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            cascade-bridge-rs
            main/cascade-bridge-rs
          save-if: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: build both, on both hosts
        run: |
          for tree in cascade-bridge-rs main/cascade-bridge-rs; do
            (cd "$tree" && cargo build --release --locked -p cascade-bridge-cli && sh package/build.sh --fast)
          done
      - name: the count on both adapters at their mains
        run: |
          set -o pipefail
          for adapter in fhir-r4 ccda; do
            cascade-bridge-rs/target/release/cascade-bridge test "cascade-bridge-adapter-$adapter" --vocabularies cascade-vocabulary > "$RUNNER_TEMP/count-$adapter.txt" || true
            {
              echo "### $adapter: entries the check fails"
              echo '```'
              grep 'the accounting is not met' "$RUNNER_TEMP/count-$adapter.txt" | sed -E 's/^  failed +([^ ]+) .*the accounting is not met at ([0-9]+) occurrence\(s\): (.*)$/\1 | \2 | \3/' || true
              echo '```'
              tail -1 "$RUNNER_TEMP/count-$adapter.txt"
            } | tee -a "$GITHUB_STEP_SUMMARY"
          done
      - name: the check on inputs it was not tuned on
        run: |
          held="$RUNNER_TEMP/held"
          mkdir -p "$held"
          run() {
            "cascade-bridge-rs/target/release/cascade-bridge" convert "cascade-bridge-adapter-$1" "$2" --vocabularies cascade-vocabulary --owed 2>&1 | tee -a "$RUNNER_TEMP/held-$1.txt"
          }
          for adapter in fhir-r4 ccda; do
            for file in cascade-bridge-adapter-$adapter/bench/*.gz; do
              out="$held/$(basename "$file" .gz)"
              gunzip -c "$file" > "$out"
              run "$adapter" "$out"
            done
          done
          for file in cascade-vocabulary/people/*/sources/*/fhir.json; do run fhir-r4 "$file"; done
          for file in cascade-vocabulary/people/*/sources/*/ccda/*.xml; do run ccda "$file"; done
          for adapter in fhir-r4 ccda; do
            {
              echo "### $adapter: held-out inputs"
              echo '```'
              cat "$RUNNER_TEMP/held-$adapter.txt"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          done
      - name: the cost against main, both hosts
        run: |
          time_of() { local start end; start=$(date +%s%N); "$@" > /dev/null 2>&1 || true; end=$(date +%s%N); echo $(( (end - start) / 1000000 )); }
          echo "### cost: wall ms of test over every entry, three alternating pairs" >> "$GITHUB_STEP_SUMMARY"
          echo "| adapter | host | main | branch |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
          for adapter in fhir-r4 ccda; do
            for host in native node; do
              mains=(); branches=()
              for round in 1 2 3 4; do
                for tree in main/cascade-bridge-rs cascade-bridge-rs; do
                  if [ "$host" = native ]; then command=("$tree/target/release/cascade-bridge"); else command=(node "$tree/hosts/node/cascade-bridge.mjs"); fi
                  ms=$(time_of "${command[@]}" test "cascade-bridge-adapter-$adapter" --vocabularies cascade-vocabulary)
                  if [ "$round" -gt 1 ]; then
                    if [ "$tree" = cascade-bridge-rs ]; then branches+=("$ms"); else mains+=("$ms"); fi
                  fi
                done
              done
              echo "| $adapter | $host | ${mains[*]} | ${branches[*]} |" >> "$GITHUB_STEP_SUMMARY"
            done
          done
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: measure-owed
          path: ${{ runner.temp }}/*.txt
